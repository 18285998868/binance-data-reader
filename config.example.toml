# 配置说明: 全部字段以小写字母开头
#
# 目录约定 (重要): dir 是数据**根目录**, 程序自动追加子路径,
#   {dir}/binance/data/{market}/{daily|monthly}/{dataset}/{symbol}[/{interval}]/*.zip
#   market = "spot" | "futures/um" | "futures/cm", 默认 "futures/um"
#   dataset = aggTrades | trades | bookTicker | bookDepth | fundingRate |
#             liquidationSnapshot | metrics | indexPriceKlines | markPriceKlines |
#             premiumIndexKlines
#   因此不要把子路径写进 dir, 否则会找不到目录.
#
# 单品种单数据集: 多品种请写多个文件或调多次 load_columns.
# 日期语义均为 UTC; end_date 含当日整天.
dataset = "metrics" # 数据集, 必填; 也兼容 type = "metrics" (下载器字段名)
market = "futures/um" # 可选, 默认 futures/um
dir = "path/to/data" # 数据根目录, 必填
symbol = "BTCUSDT" # 品种, 必填
# interval = "4h" # 仅 index/mark/premium klines 必填
# start_date = "2024-01-01" # 可选, 格式 YYYY-MM-DD
# end_date = "2024-12-31" # 可选, 含当日
