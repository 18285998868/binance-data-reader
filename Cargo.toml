[package]
name = "binance-data-reader"
version = "0.2.0"
edition = "2024"
authors = ["NautilusTrader Developer"]
license = "MIT"
description = "Read Binance public archive datasets into typed columnar tables."
repository = "https://github.com/nautechsystems/binance-data-reader"
readme = "README.md"
keywords = ["binance", "market-data", "archive", "trading"]
categories = ["finance", "parser-implementations"]

[lib]
name = "binance_data_reader"
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "binance-data-reader"
path = "src/main.rs"

[features]
default = []
python = ["dep:pyo3"]

[dependencies]
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4.5", features = ["derive"] }
csv = "1.4"
pyo3 = { version = "0.30", features = ["abi3-py39"], optional = true }
rayon = "1.12"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
toml = "1.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
zip = { version = "9", default-features = false, features = ["deflate"] }

[dev-dependencies]
tempfile = "3"

[lints.rust]
warnings = "deny"
missing_docs = "deny"
unsafe_code = "forbid"

[lints.clippy]
all = { level = "deny", priority = -1 }
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
dbg_macro = "deny"

[profile.release]
lto = "thin"
codegen-units = 1
opt-level = 3
incremental = false
strip = true
