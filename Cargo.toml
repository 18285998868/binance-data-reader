[workspace]

[package]
name = "kline-reader"
version = "0.1.0"
edition = "2024"
authors = ["NautilusTrader Developer"]
license = "MIT"

[lib]
name = "kline_reader"
crate-type = ["cdylib", "rlib"]

[dependencies]
zip = { version = "8", features = ["deflate"] }
csv = "1.3"
chrono = { version = "0.4", features = ["serde"] }
tracing = { version = "0.1", features = ["log"] }
thiserror = "2"
rayon = "1"
lzma-rs = "0.3"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
pyo3 = { version = "0.26", features = ["abi3-py39"] }

[dev-dependencies]
tempfile = "3"
toml = "1.1"

[profile.release]
lto = "fat"
codegen-units = 1
opt-level = 3
incremental = false
strip = "symbols"
